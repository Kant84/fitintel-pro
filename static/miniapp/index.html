<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://st.max.ru/js/max-web-app.js"></script>
<title>Клуб</title>
<!-- ПУТЬ ФАЙЛА: static/miniapp/index.html (репозиторий) -> контейнер /app/static/miniapp/index.html -> https://fixintel.ru/static/miniapp/index.html. ЕДИНСТВЕННАЯ копия. Копия в app/static — УДАЛЕНА (не обслуживалась). -->
<style>
:root{--mint:#00f0ff;--bg:#07070f;--panel:#0e0e1d;--row:#171732;--text:#e8e8ff;--muted:#9a9ac0;--line:#26264a;--mag:#ff2bd6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:86px}
#app{max-width:520px;margin:0 auto;padding:14px}
.top{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--mint);margin:6px 2px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 12px;text-align:center;cursor:pointer}
.tile svg{width:44px;height:44px;stroke:var(--mint)}
.tile div{margin-top:8px;font-size:14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;font-size:16px}
.row .v{font-size:15px;color:var(--muted)}
.h2{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:18px 4px 10px;font-weight:700}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.trainer{flex:0 0 120px;text-align:center}
.trainer .ph{width:120px;height:150px;border-radius:18px;background:var(--row) center/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border:1px solid var(--line)}
.trainer .nm{margin-top:6px;font-size:13px;font-weight:600}
.svc{padding:14px 4px;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}
.svc .n{font-size:16px;font-weight:600}
.svc .p{font-size:14px;color:var(--muted);margin-top:2px}
.day{font-size:13px;letter-spacing:.1em;color:var(--mag);margin:14px 4px 8px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;padding:6px 0}
nav button.on{color:var(--text)}
nav .bub{width:52px;height:34px;border-radius:18px;display:flex;align-items:center;justify-content:center}
nav button.on .bub{background:var(--mag)}
nav svg{width:22px;height:22px;stroke:currentColor}
input,textarea{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin-bottom:10px;background:var(--bg);color:var(--text)}
.btn{display:block;width:100%;padding:15px;border:1px solid var(--mint);border-radius:14px;background:transparent;color:var(--mint);font-size:16px;font-weight:700;cursor:pointer;text-align:center}
.btn.solid{background:var(--mint);color:#050510;border:0}
.mut{color:var(--muted);font-size:14px;text-align:center;margin:14px 0}
.err{background:#2a0a14;color:var(--mag);border:1px solid var(--mag);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:10px;display:none}
.back{display:inline-block;color:var(--mint);font-size:14px;margin-bottom:12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(320px,92%)}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="topupModal"><div class="box"><div style="font-size:16px;font-weight:700;margin-bottom:12px">Пополнение баланса</div><input id="tuAmount" type="number" min="1" placeholder="Сумма, ₽" inputmode="numeric"><div style="display:flex;gap:10px;margin-top:4px"><button class="btn solid" style="flex:1" onclick="doTopup()">Пополнить</button><button class="btn" style="flex:1" onclick="closeTopup()">Отмена</button></div><div id="tuHint" class="mut" style="margin-top:8px"></div></div></div>
<nav id="nav"></nav>
<script>
const API=(new URLSearchParams(location.search).get('s')||'/api/v1');
let CFG={club_name:'Клуб',slogan:'',accent:'#00f0ff',support_phone:'',support_email:'',hours:'',about:'',payments_enabled:true,logo_url:''};
let token=localStorage.getItem('fit_token')||'';
let me=JSON.parse(localStorage.getItem('fit_user')||'null');
let tab='home';
let UMAP={};
const IC={
home:'<path d="M3 11.5 12 3l9 8.5"/><path d="M5.5 10v11h13V10"/>',
store:'<path d="M4.5 9.5 5.8 4.5h12.4l1.3 5"/><path d="M4.5 9.5a2.3 2.3 0 0 0 4.6 0 2.3 2.3 0 0 0 4.7 0 2.3 2.3 0 0 0 4.7 0"/><path d="M5.5 11.5V20h13v-8.5M9.8 20v-5.5h4.4V20"/>',
dumb:'<path d="M4 9.5v5M7.5 6.5v11M16.5 6.5v11M20 9.5v5M7.5 12h9"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
menu:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',
qr:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M13.5 13.5h3v3h-3zM20.5 13.5v.01M13.5 20.5v.01M17.5 17h3v3.5h-3z"/>'};
const svg=n=>'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});
if(r.status===401){logout();throw new Error('auth')}if(!r.ok)throw new Error(r.status);return r.json()}
function logout(){token='';me=null;localStorage.clear();tab='home';render()}
async function boot(){try{CFG={...CFG,...(await (await fetch(API+'/miniapp/config')).json())};
if(CFG.accent)document.documentElement.style.setProperty('--mint',CFG.accent);
if(!token){if(await maxBoot()){render();return}render();return}
try{me=await api('/miniapp/me')}catch(e){if(e.message!=='auth')me=null}
try{const _u=await api('/users');(Array.isArray(_u)?_u:(_u.items||[])).forEach(x=>{UMAP[String(x.id)]=x.full_name||x.username||''})}catch(e){}
render()}catch(e){render()}}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={BOOKED:'Записан',CONFIRMED:'Подтверждена',CANCELLED:'Отменена',COMPLETED:'Завершена',PENDING:'Ожидает',NO_SHOW:'Не пришёл'};
const imgu=u=>{if(!u)return '';if(u.startsWith('http')&&!u.includes('fixintel.ru'))return API+'/miniapp/img?src='+encodeURIComponent(u);return u.startsWith('http')?u:'https://fixintel.ru'+u;};
function go(t){tab=t;render()}
let _qrIv=null;
function startQrTimer(){clearInterval(_qrIv);_qrIv=setInterval(function(){if(tab!=='qr'){clearInterval(_qrIv);return}var r=30-Math.floor(Date.now()%30000/1000);if(r<=0){go('qr');return}var e=document.getElementById('qrcd'),b=document.getElementById('qrbar');if(e)e.textContent=r+' сек';if(b)b.style.width=(r/30*100)+'%'},1000)}
function render(){const a=document.getElementById('app');
if(!token){a.innerHTML=`<div class="top">ВХОД</div><div class="card">
${CFG.logo_url?`<img src="${esc(CFG.logo_url)}" style="max-height:44px;max-width:180px;border-radius:8px;margin-bottom:8px">`:""}<div style="font-size:20px;font-weight:800;margin-bottom:4px">${esc(CFG.club_name)}</div>
${CFG.slogan?`<div style="color:var(--muted);font-size:13px;margin-bottom:12px">${esc(CFG.slogan)}</div>`:'<div style="margin-bottom:12px"></div>'}
<div id="err" class="err"></div>
<input id="lg" placeholder="Логин" autocomplete="username">
<input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
<button class="btn solid" onclick="doLogin()">Войти</button>
<button class="btn" style="margin-top:10px" onclick="showReg()">Зарегистрироваться</button>
<div class="mut">Вход как в десктоп-приложении. Нет пароля — на ресепшене клуба.</div></div>`;
document.getElementById('nav').innerHTML='';return}
const V={home:vHome,shop:vShop,services:vServices,schedule:vSchedule,menu:vMenu,qr:vQr,trainings:()=>vList('ТРЕНИРОВКИ','/services/trainer-schedule','Нет записей'),visits:vVisits,subs:vSubs,club:vClub,profile:vProfile,review:vReview,support:vSupport};
a.innerHTML=(V[tab]||vHome)();
if(['home','shop','services','schedule','trainings','visits','subs','menu'].includes(tab))load(tab);
if(tab==='qr')startQrTimer();
document.getElementById('nav').innerHTML=[['home','Главная','home'],['shop','Магазин','store'],['services','Услуги','dumb'],['schedule','Расписание','cal'],['menu','Меню','menu']]
.map(([k,l,i])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="bub">${svg(i)}</span>${l}</button>`).join('')}
async function doLogin(){const l=document.getElementById('lg').value.trim(),p=document.getElementById('pw').value;
try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l,password:p})});
const j=await r.json();if(!r.ok||!j.access_token)throw new Error('Неверный логин или пароль');
token=j.access_token;localStorage.setItem('fit_token',token);
try{me=await api('/miniapp/me')}catch(e){me={full_name:l}}
localStorage.setItem('fit_user',JSON.stringify(me));tab='home';render()}catch(e){const er=document.getElementById('err');er.style.display='block';er.textContent=e.message}}
let BRIDGE=null;
async function maxBoot(){
if(!window.WebApp||!WebApp.initData)return false;
try{const r=await fetch(API+'/max-bridge/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:WebApp.initData})});
const j=await r.json().catch(()=>({}));
if(j&&j.access_token){token=j.access_token;localStorage.setItem('fit_token',token);try{me=await api('/miniapp/me')}catch(e){me=null}localStorage.setItem('fit_user',JSON.stringify(me||{}));return true}
if(j&&j.registered===false){BRIDGE=j}}catch(e){}
return false}
async function regViaMax(){
const g=id=>document.getElementById(id).value.trim();
if(g('bm_pw')!==g('bm_pw2'))return alert('Пароли не совпадают');
let ct;try{ct=await WebApp.requestContact()}catch(e){return alert('Без подтверждения телефона регистрация невозможна')}
if(!ct||!ct.phone)return alert('Телефон не получен');
try{const r=await fetch(API+'/max-bridge/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:WebApp.initData,full_name:g('bm_fn'),birth_year:g('bm_by')?parseInt(g('bm_by')):null,password:g('bm_pw'),phone:ct.phone,contact_hash:ct.hash,contact_auth_date:ct.authDate})});
const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token){alert(j.detail||'Ошибка регистрации');return}
token=j.access_token;localStorage.setItem('fit_token',token);try{me=await api('/miniapp/me')}catch(e){me={full_name:g('bm_fn')}}
localStorage.setItem('fit_user',JSON.stringify(me||{}));tab='home';render()}catch(e){alert('Ошибка сети')}}
function showReg(){const c=document.querySelector('#app .card');if(!c)return;
if(BRIDGE){c.innerHTML=`<div style="font-size:20px;font-weight:800;margin-bottom:4px">${esc(CFG.club_name)}</div>
<div class="mut" style="text-align:left;margin-bottom:10px">Регистрация через MAX: телефон подтвердится автоматически</div>
<div id="err" class="err"></div>
<input id="bm_fn" placeholder="ФИО" value="${esc((BRIDGE.last_name+' '+BRIDGE.first_name).trim())}">
<input id="bm_by" placeholder="Год рождения" inputmode="numeric">
<input value="Телефон подтвердится в MAX" disabled style="opacity:.6">
<input id="bm_pw" type="password" placeholder="Пароль (мин. 8 символов)">
<input id="bm_pw2" type="password" placeholder="Повторите пароль">
<button class="btn solid" onclick="regViaMax()">Подтвердить телефон и зарегистрироваться</button>
<div class="mut" style="margin-top:10px;cursor:pointer" onclick="logout()">У меня есть аккаунт — войти</div>`;return;}
c.innerHTML=`<div style="font-size:20px;font-weight:800;margin-bottom:4px">${esc(CFG.club_name)}</div>
<div class="mut" style="text-align:left;margin-bottom:10px">Код подтверждения придёт в MAX (кнопка «Получить код»; в боте должны нажать «Старт» хотя бы раз)</div>
<div id="err" class="err"></div>
<input id="rg_fn" placeholder="ФИО">
<input id="rg_by" placeholder="Год рождения" inputmode="numeric">
<input id="rg_ph" placeholder="Телефон +7…" inputmode="tel">
<input id="rg_em" placeholder="Email (необязательно)">
<div style="display:flex;gap:8px"><input id="rg_cd" placeholder="Код из MAX" style="flex:1"><button class="btn" style="width:auto;padding:15px 12px" onclick="getCode()">Получить код</button></div>
<input id="rg_pw" type="password" placeholder="Пароль (мин. 8 символов)">
<input id="rg_pw2" type="password" placeholder="Повторите пароль">
<button class="btn solid" onclick="doRegister()">Зарегистрироваться</button>
<div class="mut" style="margin-top:10px;cursor:pointer" onclick="logout()">У меня есть аккаунт — войти</div>`}
async function getCode(){const ph=document.getElementById('rg_ph').value.trim();if(!ph)return alert('Введите телефон');
try{const r=await fetch(API+'/phone-verify/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph})});const j=await r.json().catch(()=>({}));
if(!r.ok){alert(j.detail||'Не удалось отправить код');return}
alert('Код отправлен в MAX'+(j.dev_code?(' (тест: '+j.dev_code+')'):''))}catch(e){alert('Ошибка сети')}}
async function doRegister(){const g=id=>document.getElementById(id).value.trim();
if(g('rg_pw')!==g('rg_pw2'))return alert('Пароли не совпадают');
try{const r=await fetch(API+'/miniapp/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:g('rg_fn'),birth_year:g('rg_by')?parseInt(g('rg_by')):null,phone:g('rg_ph'),email:g('rg_em')||null,code:g('rg_cd'),password:g('rg_pw')})});
const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token){alert(j.detail||'Ошибка регистрации');return}
token=j.access_token;localStorage.setItem('fit_token',token);
try{me=await api('/miniapp/me')}catch(e){me={full_name:g('rg_fn')}}
localStorage.setItem('fit_user',JSON.stringify(me));tab='home';render()}catch(e){alert('Ошибка сети')}}
let TUCFG={min:100,bonus_percent:5};
async function topUp(){try{TUCFG=await api('/miniapp/wallet/config')}catch(e){}
document.getElementById('tuHint').textContent='\u041c\u0438\u043d\u0438\u043c\u0443\u043c '+TUCFG.min+' \u20bd \u00b7 \u0431\u043e\u043d\u0443\u0441\u044b '+TUCFG.bonus_percent+'%';
document.getElementById('tuAmount').value='';document.getElementById('topupModal').classList.add('show')}
function closeTopup(){document.getElementById('topupModal').classList.remove('show')}
async function doTopup(){const amt=parseFloat(document.getElementById('tuAmount').value);if(isNaN(amt)||amt<TUCFG.min){document.getElementById('tuHint').textContent='\u041c\u0438\u043d\u0438\u043c\u0443\u043c '+TUCFG.min+' \u20bd';return}
try{const r=await fetch(API+'/miniapp/wallet/topup',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({amount:amt})});const j=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('tuHint').textContent=j.detail||'\u041e\u0448\u0438\u0431\u043a\u0430';return}
if(j.payment_url){location.href=j.payment_url;return}
closeTopup();alert('\u0417\u0430\u0447\u0438\u0441\u043b\u0435\u043d\u043e: '+j.balance+' \u20bd (\u0431\u043e\u043d\u0443\u0441\u044b +'+j.bonuses_added+')');load('menu')}catch(e){document.getElementById('tuHint').textContent='\u041e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0442\u0438'}}
function vHome(){return `${CFG.logo_url?`<img src="${esc(CFG.logo_url)}" style="max-height:36px;max-width:160px;border-radius:8px;margin:2px 2px 8px">`:""}<div class="top">${esc(CFG.club_name).toUpperCase()}</div>
<div class="grid2"><div class="tile" onclick="go('qr')">${svg('qr')}<div>QR-код</div></div>
${CFG.payments_enabled===false?`<div class="tile" onclick="go('services')">${svg('dumb')}<div>Услуги</div></div>`:`<div class="tile" onclick="go('shop')">${svg('store')}<div>Купить</div></div>`}</div>
<div class="card" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
<div><div style="font-size:16px;font-weight:700">Загруженность клуба</div><div style="font-size:26px;font-weight:800">0 чел.</div></div>
<div style="width:64px;height:64px;border-radius:50%;background:var(--row);display:flex;align-items:center;justify-content:center;font-weight:700">0%</div></div>
<div class="h2">НОВОСТИ КЛУБА</div><div class="card" id="newsbox"><span class="mut">Загрузка…</span></div>
<div class="h2">НАШИ ТРЕНЕРЫ</div><div class="hscroll" id="trainers"><span class="mut">Загрузка…</span></div>`}
function vShop(){if(CFG.payments_enabled===false)return `<div class="top">МАГАЗИН</div><div class="mut">Покупки через приложение временно отключены клубом</div>`;return `<div class="top">МАГАЗИН</div><div id="goods"><span class="mut">Загрузка…</span></div>`}
function vServices(){return `<div class="top">УСЛУГИ</div><button class="btn solid" style="margin-bottom:12px" onclick="openBooking()">Записаться на занятие</button><div class="card" id="svclist"><span class="mut">Загрузка…</span></div>`}
function vSchedule(){return `<div class="top">РАСПИСАНИЕ</div><div id="sched"><span class="mut">Загрузка…</span></div>`}
async function changePwd(){const a=document.getElementById('pw0').value,b=document.getElementById('pw1').value,c=document.getElementById('pw2').value;
if(!a||!b)return alert('Заполните поля');
if(b.length<8)return alert('Новый пароль минимум 8 символов');
if(b!==c)return alert('Новые пароли не совпадают');
try{const r=await fetch(API+'/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({current_password:a,new_password:b,old_password:a,password:b})});
const j=await r.json().catch(()=>({}));
if(!r.ok){alert(j.detail||('Ошибка '+r.status));return}
alert('Пароль изменён. Войдите заново.');logout()}catch(e){alert('Ошибка сети')}}
async function editProfile(){if(!me)return;const fn=prompt('ФИО',me.full_name||'');if(fn===null)return;const by=prompt('Год рождения',(me.birth_date||'').slice(0,4));if(by===null)return;const em=prompt('Email',me.email||'');if(em===null)return;
try{const r=await fetch(API+'/miniapp/me',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({full_name:fn.trim(),birth_year:by.trim()?parseInt(by.trim()):null,email:em.trim()||null})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.detail||'Ошибка');return}me=j;localStorage.setItem('fit_user',JSON.stringify(j));alert('Сохранено');render()}catch(e){alert('Ошибка сети')}}
let BK=null;
async function openBooking(){try{const c=await api('/miniapp/booking/catalog');BK={step:1,catalog:c};renderBooking()}catch(e){alert('Не удалось загрузить')}}
function renderBooking(){const a=document.getElementById('app');const c=BK.catalog;
if(BK.step===5){bkRenderMy(a);return}
if(BK.step===1){a.innerHTML='<button class="btn" style="margin-bottom:10px" onclick="BK.step=5;renderBooking()">Мои записи</button>'+`<span class="back" onclick="go('services')">\u2039 \u041d\u0430\u0437\u0430\u0434</span><div class="top">\u0412\u042b\u0411\u041e\u0420 \u0422\u0420\u0415\u041d\u0415\u0420\u0410</div><div class="card">`+(c.trainers.length?c.trainers.map(t=>`<div class="svc" onclick="bkTrainer('${t.id}')"><div class="n">${esc(t.name)}</div><div class="p">${esc(t.spec||'')}</div></div>`).join(''):'<div class="mut">\u0422\u0440\u0435\u043d\u0435\u0440\u044b \u0441\u043a\u043e\u0440\u043e \u043f\u043e\u044f\u0432\u044f\u0442\u0441\u044f</div>')+`</div>`;return}
if(BK.step===2){const svcs=c.services.filter(x=>x.trainer_id===BK.trainer.id&&x.schedule&&x.schedule.time_slots&&x.schedule.time_slots.length);
a.innerHTML=`<span class="back" onclick="BK.step=1;renderBooking()">\u2039 \u041d\u0430\u0437\u0430\u0434</span><div class="top">\u0417\u0410\u041d\u042f\u0422\u0418\u0415</div><div class="card">`+(svcs.length?svcs.map(x=>`<div class="svc" onclick="bkService('${x.id}')"><div class="n">${esc(x.name)}</div><div class="p">${x.price} \u20bd \u00b7 ${x.duration||'\u2014'} \u043c\u0438\u043d</div></div>`).join(''):'<div class="mut">\u041e\u043d\u043b\u0430\u0439\u043d-\u0437\u0430\u043f\u0438\u0441\u0438 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u044b \u2014 \u0443\u0442\u043e\u0447\u043d\u0438\u0442\u0435 \u043d\u0430 \u0440\u0435\u0441\u0435\u043f\u0448\u0435\u043d\u0435</div>')+`</div>`;return}
if(BK.step===3){const days=BK.service.schedule.days||[];let opts=[];for(let add=0;add<30&&opts.length<12;add++){const d=new Date();d.setDate(d.getDate()+add);const wd=(d.getDay()+6)%7;if(days.length&&!days.includes(wd))continue;opts.push(d)}
const months={};opts.forEach(d=>{const k=d.toLocaleDateString('ru',{month:'long',year:'numeric'});(months[k]=months[k]||[]).push(d)});
a.innerHTML=`<span class="back" onclick="BK.step=2;renderBooking()">\u2039 \u041d\u0430\u0437\u0430\u0434</span><div class="top">\u0414\u0410\u0422\u0410</div><div class="card">`+Object.keys(months).map(m=>`<div class="day">${m}</div>`+months[m].map(d=>`<div class="svc" onclick="bkDay('${d.toISOString().slice(0,10)}')"><div class="n">${d.toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'long'})}</div></div>`).join('')).join('')+`</div>`;return}
if(BK.step===4){a.innerHTML=`<span class="back" onclick="BK.step=3;renderBooking()">\u2039 \u041d\u0430\u0437\u0430\u0434</span><div class="top">\u0412\u0420\u0415\u041c\u042f</div><div class="card" id="bkSlots"><span class="mut">\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430\u2026</span></div>`;
api('/miniapp/booking/slots?service_id='+BK.service.id+'&day='+BK.day).then(r=>{const items=r.items||[];const e=document.getElementById('bkSlots');if(e)e.innerHTML=items.length?items.map(x=>`<div class="svc" onclick="bkConfirm('${x.time}')"><div class="n">${x.time}</div><div class="p">\u043c\u0435\u0441\u0442: ${x.left}</div></div>`).join(''):'<div class="mut">\u0421\u0432\u043e\u0431\u043e\u0434\u043d\u043e\u0433\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u043d\u0435\u0442</div>'}).catch(()=>{const e=document.getElementById('bkSlots');if(e)e.innerHTML='<div class="mut">\u041e\u0448\u0438\u0431\u043a\u0430</div>'});return}}
async function bkRenderMy(a){let items=[];try{const r=await api('/miniapp/booking/my');items=r.items||[]}catch(e){}
a.innerHTML=`<span class="back" onclick="BK.step=1;renderBooking()">&#8249; \u041d\u0430\u0437\u0430\u0434</span><div class="top">\u041c\u041e\u0418 \u0417\u0410\u041f\u0418\u0421\u0418</div><div class="card">`+(items.length?items.map(x=>{const can=['BOOKED','CONFIRMED'].includes(x.status);return `<div class="svc"><div class="n">${esc(x.service)} \u2014 ${x.when.slice(8,10)}.${x.when.slice(5,7)} ${x.when.slice(11,16)}</div><div class="p">${(x.status==='CANCELLED'||x.status==='AUTO_CANCELLED')?'<span style="color:#ef4444">'+(({CANCELLED:'\u043e\u0442\u043c\u0435\u043d\u0435\u043d\u0430',AUTO_CANCELLED:'\u043e\u0442\u043c\u0435\u043d\u0435\u043d\u0430 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438'})[x.status])+'</span>':esc((({BOOKED:'\u0437\u0430\u043f\u0438\u0441\u0430\u043d',CONFIRMED:'\u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0430',PAID:'\u043e\u043f\u043b\u0430\u0447\u0435\u043d\u0430',COMPLETED:'\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0430'})[x.status])||x.status)}</div>${can?`<button class="btn" style="margin-top:6px" onclick="bkCancel('${x.id}')">\u041e\u0442\u043c\u0435\u043d\u0438\u0442\u044c \u0437\u0430\u043f\u0438\u0441\u044c</button>`:''}</div>`}).join(''):'<div class="mut">\u0417\u0430\u043f\u0438\u0441\u0435\u0439 \u043d\u0435\u0442</div>')+`</div>`}
async function bkCancel(bid){try{const r=await fetch(API+'/miniapp/booking/'+bid,{method:'DELETE',headers:{Authorization:'Bearer '+token}});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.detail||'\u041e\u0448\u0438\u0431\u043a\u0430');return}alert('\u0417\u0430\u043f\u0438\u0441\u044c \u043e\u0442\u043c\u0435\u043d\u0435\u043d\u0430');BK.step=5;renderBooking()}catch(e){alert('\u041e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0442\u0438')}}
function bkTrainer(id){BK.trainer=BK.catalog.trainers.find(t=>t.id===id);BK.step=2;renderBooking()}
function bkService(id){BK.service=BK.catalog.services.find(x=>x.id===id);BK.step=3;renderBooking()}
function bkDay(iso){BK.day=iso;BK.step=4;renderBooking()}
async function bkConfirm(t){try{const r=await fetch(API+'/miniapp/booking',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({service_id:BK.service.id,day:BK.day,time:t})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.detail||'\u041e\u0448\u0438\u0431\u043a\u0430');return}alert('\u0417\u0430\u043f\u0438\u0441\u044c \u0441\u043e\u0437\u0434\u0430\u043d\u0430: '+j.service+' \u00b7 '+j.when);tab='schedule';render()}catch(e){alert('\u041e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0442\u0438')}}
function vQr(){return `<span class="back" onclick="go('home')">‹ Назад</span><div class="top">QR ДЛЯ ВХОДА</div>
<div class="card" style="text-align:center" id="qrbox"><span class="mut">Формирую код…</span></div>`}
function vList(title,path,empty){return `<span class="back" onclick="go('menu')">‹ Назад</span><div class="top">${title}</div><div class="card" id="lst"><span class="mut">Загрузка…</span></div>
<script>loadList('${path}','${empty}')<\/script>`}
function vVisits(){setTimeout(loadVisits,0);return `<span class="back" onclick="go('menu')">&#8249; Назад</span><div class="top">ПОСЕЩЕНИЯ</div><div class="card" id="visitsbox"><span class="mut">Загрузка…</span></div>`}
function vSubs(){setTimeout(loadSubs,0);return `<span class="back" onclick="go('menu')">&#8249; Назад</span><div class="top">ИСТОРИЯ ПОДПИСОК</div><div class="card" id="subsbox"><span class="mut">Загрузка…</span></div>`}
async function loadVisits(){try{const r=await api('/miniapp/visits');const items=r.items||[];const e=document.getElementById('visitsbox');if(!e)return;e.innerHTML=items.length?items.map(x=>`<div class="svc"><div class="n">${esc(x.title)}</div><div class="p">${esc(x.sub||'')}</div></div>`).join(''):'<div class="mut">Посещений пока нет</div>'}catch(_e){const e=document.getElementById('visitsbox');if(e)e.innerHTML='<div class="mut">Посещений пока нет</div>'}}
async function loadSubs(){try{const r=await api('/miniapp/subscriptions');const items=r.items||[];const e=document.getElementById('subsbox');if(!e)return;e.innerHTML=items.length?items.map(x=>`<div class="svc"><div class="n">${esc(x.title)}</div><div class="p">${esc(x.sub||'')}</div></div>`).join(''):'<div class="mut">Нет подписок</div>'}catch(_e){const e=document.getElementById('subsbox');if(e)e.innerHTML='<div class="mut">Нет подписок</div>'}}
function vClub(){return `<span class="back" onclick="go('menu')">‹ Назад</span><div class="top">О КЛУБЕ</div>
<div class="card"><div style="font-size:20px;font-weight:800">${esc(CFG.club_name)}</div>
${CFG.slogan?`<div class="mut" style="text-align:left">${esc(CFG.slogan)}</div>`:''}
${CFG.about?`<div class="svc"><div class="p" style="white-space:pre-wrap">${esc(CFG.about)}</div></div>`:''}
<div class="svc"><div class="p">Часы работы: ${esc(CFG.hours)}</div></div></div>`}
function vProfile(){const L={full_name:'ФИО',name:'ФИО',fio:'ФИО',email:'Email',username:'Логин',login:'Логин',phone:'Телефон',is_active:'Активен',roles:'Роль',role:'Роль',permissions:'Права',balance:'Баланс, ₽',created_at:'Дата регистрации',birth_date:'Дата рождения',id:'ID'};
const rows=me?Object.entries(me).filter(([k,v])=>L[k]&&String(v||'')!=='').map(([k,v])=>`<div class="svc"><div class="n" style="font-size:14px">${L[k]}</div><div class="p">${esc(String(v))}</div></div>`).join(''):'';
return `<span class="back" onclick="go('menu')">‹ Назад</span><div class="top">ПРОФИЛЬ</div><div class="card">${rows||'<div class="mut">Нет данных</div>'}</div>
<button class="btn" onclick="editProfile()">Изменить данные</button>
<div class="h2" style="margin-top:14px">БЕЗОПАСНОСТЬ</div><div class="card">
<input id="pw0" type="password" placeholder="Текущий пароль">
<input id="pw1" type="password" placeholder="Новый пароль (мин. 8 символов)">
<input id="pw2" type="password" placeholder="Повторите новый пароль">
<button class="btn solid" onclick="changePwd()">Сменить пароль</button></div>
<button class="btn" onclick="logout()">Выйти</button>`}
function vReview(){return `<span class="back" onclick="go('menu')">‹ Назад</span><div class="top">ОСТАВИТЬ ОТЗЫВ</div>
<div class="card"><input id="rvt" placeholder="Тема"><textarea id="rvx" rows="4" placeholder="Текст отзыва"></textarea>
<button class="btn solid" onclick="sendReview()">Отправить</button></div>`}
function vSupport(){return `<span class="back" onclick="go('menu')">‹ Назад</span><div class="top">ПОДДЕРЖКА</div>
<div class="card"><div class="svc"><div class="n">${esc(CFG.support_phone||'—')}</div><div class="p">Телефон</div></div>
<div class="svc"><div class="n">${esc(CFG.support_email||'—')}</div><div class="p">Email</div></div></div>`}
async function sendReview(){const t=document.getElementById('rvt').value,x=document.getElementById('rvx').value;
try{await fetch(API+'/miniapp/feedback',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({theme:t,body:x,client_id:me?(me.id||''):''})});}catch(e){}
location.href='mailto:'+(CFG.feedback_email||CFG.support_email||'support@fitintel.ru')+'?subject='+encodeURIComponent('Отзыв: '+t)+'&body='+encodeURIComponent(x)}
function vMenu(){const n=me?(me.full_name||me.name||me.fio||'Пользователь'):'Пользователь';
return `<div class="top">МЕНЮ</div><div class="card" style="display:flex;gap:14px;align-items:center" onclick="go('profile')">
<div style="width:64px;height:64px;border-radius:50%;border:2px solid var(--mint);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9a9ac0" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M5 20.5c.5-3.8 3.4-5.7 7-5.7s6.5 1.9 7 5.7"/></svg></div>
<div><div style="font-size:19px;font-weight:800">${esc(n)}</div><div style="color:var(--muted);font-size:14px">${esc(me&&me.phone||'')}</div></div></div>
<div class="card" id="walletbox" style="margin-top:12px"><div style="display:flex;justify-content:space-around;text-align:center"><div><div style="font-size:12px;color:var(--muted)">Баланс</div><div id="wbal" style="font-size:18px;font-weight:800">—</div></div><div><div style="font-size:12px;color:var(--muted)">Бонусы</div><div id="wbon" style="font-size:18px;font-weight:800;color:var(--mag)">—</div></div></div><button class="btn solid" style="margin-top:12px;padding:12px" onclick="topUp()">+ Пополнить баланс</button></div>
<div class="grid2"><div class="tile" onclick="go('qr')">${svg('qr')}<div>Мой QR</div></div>
<div class="tile" onclick="go('subs')">${svg('cal')}<div>Абонемент</div></div></div>
<div class="h2">МОЯ ИСТОРИЯ</div><div class="card">
<div class="row" onclick="go('trainings')"><span class="t">Тренировки</span><span class="v">›</span></div>
<div class="row" onclick="go('visits')"><span class="t">Посещения</span><span class="v">›</span></div>
<div class="row" onclick="go('subs')"><span class="t">История подписок</span><span class="v">›</span></div></div>
<div class="h2">ДОПОЛНИТЕЛЬНО</div><div class="card">
<div class="row" onclick="go('qr')"><span class="t">Сгенерировать QR профиля</span><span class="v">›</span></div>
<div class="row" onclick="go('club')"><span class="t">О клубе</span><span class="v">›</span></div>
<div class="row" onclick="go('profile')"><span class="t">Профиль</span><span class="v">›</span></div>
<div class="row" onclick="go('review')"><span class="t">Оставить отзыв</span><span class="v">›</span></div>
<div class="row" onclick="go('support')"><span class="t">Поддержка</span><span class="v">›</span></div></div>`}
async function load(t){
if(t==='home'){try{const r=await api('/trainers/profiles');const rows=Array.isArray(r)?r:(r.items||r.profiles||r.trainers||r.data||[]);
document.getElementById('trainers').innerHTML=(rows||[]).map(x=>{const ph=imgu(x.photo_url);
return `<div class="trainer"><div class="ph" ${ph?`style="background-image:url('${ph}')"`:''}>${ph?'':'Фото'}</div><div class="nm">${esc(UMAP[String(x.user_id)]||x.full_name||x.name||x.specialization||'')}</div>${((UMAP[String(x.user_id)]||x.full_name||x.name)&&(x.specialization||''))?`<div style="font-size:11px;color:var(--muted)">${esc(x.specialization||'')}</div>`:''}</div>`}).join('')||'<span class="mut">Скоро</span>'}catch(e){document.getElementById('trainers').innerHTML='<span class="mut">Скоро</span>'}}
if(t==='home'){try{const n=await api('/miniapp/news');const items=(n.items||[]).slice(0,3);document.getElementById('newsbox').innerHTML=items.length?items.map(x=>`<div class="svc"><div class="n">${esc(x.title)}</div><div class="p">${esc((x.body||'').slice(0,120))}</div></div>`).join(''):'<div class="mut">Новости скоро появятся</div>'}catch(e){const e2=document.getElementById('newsbox');if(e2)e2.innerHTML='<div class="mut">Новости скоро появятся</div>'}}
if(t==='shop'){try{const g=await api('/warehouse/products?club_id=1');const rows=g.items||g;
document.getElementById('goods').innerHTML=rows.length?rows.map(p=>`<div class="card"><div class="svc"><div class="n">${esc(p.name)}</div><div class="p">${esc(p.article||'')} · ${Number(p.sale_price||p.price||0)} ₽ · остаток: ${Number(p.quantity||0)}</div></div></div>`).join(''):'<div class="mut">Товары появятся скоро — уточните на ресепшене</div>'}catch(e){document.getElementById('goods').innerHTML='<div class="mut">Товары появятся скоро</div>'}}
if(t==='services'){try{const s=await api('/services');const rows=s.items||s;
document.getElementById('svclist').innerHTML=rows.map(x=>`<div class="svc"><div class="n">${esc(x.name)}</div><div class="p">${Number(x.price||0)} ₽</div></div>`).join('')||'—'}catch(e){document.getElementById('svclist').innerHTML='<span class="mut">Скоро</span>'}}
if(t==='qr'){const box=document.getElementById('qrbox');try{
const g=await api('/dynamic-qr/generate',{method:'POST',body:JSON.stringify({client_id:((me&&me.client_id)||(me&&me.id)||me&&me.user_id),expires_in_minutes:2})});
const data=encodeURIComponent(g.qr_payload||'');
box.innerHTML=`<img style="width:280px;height:280px;border-radius:12px;background:#fff;padding:6px" src="${API}/miniapp/qr?data=${data}">
<div id="qrcd" style="font-size:30px;font-weight:800;color:var(--mint);margin:12px 0 8px">${30-Math.floor(Date.now()%30000/1000)} сек</div>
<div style="height:6px;background:var(--row);border-radius:3px;overflow:hidden"><div id="qrbar" style="height:100%;width:100%;background:var(--mag);transition:width 1s linear"></div></div>
<div class="mut" style="margin-top:10px">Код обновляется каждые 30 секунд</div>`;
}catch(e){const id=(me&&(me.id||me.user_id))||'guest';const data=encodeURIComponent('fitintel:profile:'+id);
box.innerHTML=`<div class="err" style="display:block">Вход по QR недоступен: нет активного абонемента или оплаченного занятия</div>
<img style="width:280px;height:280px;border-radius:12px" src="${API}/miniapp/qr?data=${data}">
<div class="mut">QR профиля</div>`}}
if(t==='menu'){try{const w=await api('/miniapp/wallet');const b=document.getElementById('wbal'),o=document.getElementById('wbon');if(b)b.textContent=(w.balance!=null?(w.balance+' \u20bd'):'0 \u20bd');if(o)o.textContent=(w.bonuses!=null?String(w.bonuses):'0')}catch(e){}}
if(t==='schedule'){try{const s=await api('/services/trainer-schedule');const rows=s.items||s;
const mine=(rows||[]);
if(!mine.length){document.getElementById('sched').innerHTML='<div class="mut">Записей нет. Запишитесь на ресепшене.</div>';return}
const by={};mine.forEach(b=>{const d=(b.booking_date||'').slice(0,10);(by[d]=by[d]||[]).push(b)});
document.getElementById('sched').innerHTML=Object.keys(by).sort().map(d=>`<div class="day">${d.split('-').reverse().join('.')}</div><div class="card">`+by[d].map(b=>`<div class="svc"><div class="n">${esc(b.service_name||'Занятие')}</div><div class="p">${(b.booking_date||'').slice(11,16)} · ${esc(b.trainer_name||'')} · ${esc(ST[b.status]||b.status||'')}</div></div>`).join('')+'</div>').join('')}catch(e){document.getElementById('sched').innerHTML='<div class="mut">Скоро</div>'}}
if(['trainings'].includes(t)){const map={trainings:['/services/trainer-schedule','Нет записей'],visits:['/visits','Посещений пока нет'],subs:['/subscriptions/my','Нет подписок']};
const[path,empty]=map[t];try{const r=await api(path);const rows=r.items||r;
document.getElementById('lst').innerHTML=(rows&&rows.length)?rows.map(b=>`<div class="svc"><div class="n">${esc(b.service_name||b.entry_time||b.tariff_name||JSON.stringify(b).slice(0,60))}</div><div class="p">${esc(b.booking_date||b.entry_time||b.created_at||'')}</div></div>`).join(''):`<div class="mut">${empty}</div>`}catch(e){document.getElementById('lst').innerHTML=`<div class="mut">${empty}</div>`}}}
boot();
</script>
</body>
</html>
