<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Терминал турникета</title>
<style>
:root{--mint:#00f0ff;--bg:#07070f;--panel:#0e0e1d;--row:#171732;--text:#e8e8ff;--muted:#9a9ac0;--line:#26264a;--mag:#ff2bd6;--ok:#00e676;--err:#ff3860}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:15px;letter-spacing:.12em;color:var(--mint);margin:6px 0 10px;font-weight:800}
#setup{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
#setup .row{display:flex;gap:8px;margin-bottom:8px}
#setup .row:last-child{margin-bottom:0}
#setup label{font-size:12px;color:var(--muted);width:86px;padding-top:11px}
#setup input,#setup select{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px}
#setup button{padding:11px 16px;border:0;border-radius:10px;background:var(--mint);color:#050510;font-weight:700;font-size:14px;cursor:pointer}
#cam{width:100%;max-width:440px;border-radius:16px;border:1px solid var(--line);background:#000;aspect-ratio:4/3;object-fit:cover}
#status{margin-top:12px;width:100%;max-width:440px;padding:18px;border-radius:14px;text-align:center;font-size:18px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
#status.ok{background:#06281a;border-color:var(--ok);color:var(--ok)}
#status.err{background:#2a0a14;border-color:var(--err);color:var(--err)}
#status.wait{color:var(--mint)}
.row2{margin-top:10px;width:100%;max-width:440px;display:flex;gap:8px}
.row2 input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px}
.row2 button{padding:12px 16px;border:0;border-radius:10px;background:var(--mag);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.mut{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
#devname{color:var(--mint);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>ТЕРМИНАЛ ТУРНИКЕТА</h1>
<div id="setup">
  <div class="row"><label>Контроллер</label><input id="dev" placeholder="device_id из «Подключения»"><button onclick="saveSetup()">Сохранить</button></div>
  <div class="row"><label>Направление</label><select id="zone"><option value="entry">Вход</option><option value="exit">Выход</option></select></div>
</div>
<video id="cam" autoplay playsinline muted></video>
<div id="status" class="wait">Запуск камеры…</div>
<div id="dbg" class="mut" style="color:#ff9a3c"></div>
<div id="devname"></div>
<div class="row2"><input id="manual" placeholder="ручной ввод QR"><button onclick="handle(document.getElementById('manual').value)">Проверить</button></div>
<div class="mut">ID контроллера указывается один раз — он сохранится в этом браузере</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const API='/api/v1';
let _busy=false,_last='';
function DEV(){return localStorage.getItem('term_dev')||'turnstile_main_entrance'}
function ZONE(){return document.getElementById('zone').value}
function setStatus(t,cls){const e=document.getElementById('status');e.textContent=t;e.className=cls||''}
function dbg(t){const e=document.getElementById('dbg');if(e)e.textContent=t}
window.onerror=function(m,src,l){dbg('JS-ошибка: '+m+' (строка '+l+')');setStatus('Ошибка страницы — пришлите текст ниже','err')};
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=0.15;o.start();setTimeout(()=>{o.stop();c.close()},180)}catch(e){}}
function saveSetup(){const v=document.getElementById('dev').value.trim();localStorage.setItem('term_dev',v);document.getElementById('devname').textContent=v?('Контроллер: '+v+(ZONE()==='exit'?' · выход':' · вход')):'Контроллер не задан';setStatus(v?'Готов. Покажите QR-код':'Укажите device_id контроллера из «Подключения»',v?'wait':'err')}
async function handle(qr){qr=(qr||'').trim();if(!qr||_busy)return;
dbg('считан код: '+qr.slice(0,60)+'…');
const dev=DEV();if(!dev){setStatus('Сначала укажите device_id контроллера','err');return}
_busy=true;setStatus('Проверка…','wait');
try{const r=await fetch(API+'/dynamic-qr/turnstile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qr_payload:qr,device_id:dev,zone:ZONE()})});
const j=await r.json().catch(()=>({}));
if(r.ok&&j.access_granted){beep(true);setStatus('✅ ДОСТУП РАЗРЕШЁН'+(j.reason?' — '+j.reason:''),'ok')}
else{beep(false);setStatus('⛔ ВХОД ЗАПРЕЩЁН: '+(j.detail||'отклонено'),'err')}}catch(e){setStatus('Ошибка сети: '+e.message,'err')}
setTimeout(()=>{_busy=false;_last=''},2500)}
async function startCamera(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Браузер не умеет камеру — откройте в Chrome/Edge','err');dbg('нет getUserMedia');return}
try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});document.getElementById('cam').srcObject=st;dbg('камера: поток получен, ищу QR…');scan()}
catch(e){setStatus('Камера недоступна — разрешите доступ (иконка в адресной строке)','err');dbg('getUserMedia: '+e.name+' '+e.message)}}
async function scan(){
const video=document.getElementById('cam');
if('BarcodeDetector' in window){
  const bd=new BarcodeDetector({formats:['qr_code']});
  const tick=async()=>{if(video.readyState===4){try{const codes=await bd.detect(video);if(codes.length){const val=codes[0].rawValue;if(val&&val!==_last&&!_busy){_last=val;document.getElementById('manual').value=val;handle(val)}}}catch(e){}}
  requestAnimationFrame(tick)};tick();return}
if(typeof jsQR!=='undefined'){
  dbg('детектор браузера нет — декодирую через jsQR');
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(video.readyState===4){try{canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const d=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});if(code&&code.data&&code.data!==_last&&!_busy){_last=code.data;document.getElementById('manual').value=code.data;handle(code.data)}}catch(e){}}
  setTimeout(()=>requestAnimationFrame(tick),250)};tick();return}
setStatus('Нет детектора QR и не загрузилась библиотека (нужен интернет для CDN) — откройте в Chrome/Edge','err');
dbg('BarcodeDetector отсутствует, jsQR не загружен — проверьте доступ к cdn.jsdelivr.net')}
document.getElementById('dev').value=DEV();
document.getElementById('zone').value=localStorage.getItem('term_zone')||'entry';
document.getElementById('zone').onchange=e=>{localStorage.setItem('term_zone',e.target.value);saveSetup()};
saveSetup();startCamera();
</script>
</body>
</html>
