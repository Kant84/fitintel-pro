name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app scripts migrations tests || true
      - run: python -m compileall -q app scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gcc g++ cmake make libpq-dev libpcsclite-dev libopenblas-dev
      - name: Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-base.txt
          pip install -r requirements.txt
          pip install pytest
      - name: Pytest
        run: pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fitintel:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
