# Kerong KR-S80 Configuration for FitIntel Pro
# ============================================================
# Файл конфигурации замка Kerong KR-S80
# ============================================================

[DEVICE]
model = KR-S80
lock_id = KR-S80-001
location = раздевалка М
group = man
lock_type = cabinet

[NETWORK]
# Если замок подключен через WiFi/Ethernet:
server_url = http://192.168.1.50:8001/api/v1/kerong
sync_interval_sec = 300
timeout_ms = 5000
retry_count = 3

[AUTH]
# Basic Auth (если требуется)
username = kerong
password = kerong_secret_2026

[FEATURES]
auto_lock_sec = 5
beep_on_open = true
led_indicator = true
offline_mode = true

[SYNC]
# Режим синхронизации:
# - "online": запрос к серверу при каждом открытии
# - "offline": периодическая синхронизация списка карт
# - "hybrid": офлайн + онлайн проверка
mode = hybrid
whitelist_update_interval = 300
