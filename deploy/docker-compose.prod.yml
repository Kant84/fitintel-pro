# FitIntel Pro — ПРОДУКЦИОННЫЙ деплой (клуб).
# Отличия от тестового: образ из архива (не сборка на месте), секреты обязательны
# из .env, примонтирована папка бэкапов, заготовка под TLS.
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnexus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fitnexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в deploy/.env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
      - ./backups:/backups          # сюда scripts/backup.sh пишет дампы
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fitnexus_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  api:
    image: fitintel:prod            # загружается из fitintel-prod.tar (docker load)
    env_file: .env
    environment:
      APP_ENV: prod
      ACCOUNTING_DB: /app/data_accounting/fitintel_accounting.db
      APP_DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: ${TZ:-Europe/Moscow}
      # лимиты BLAS-потоков (dlib/numpy): без них на CPU-серверах запросы
      # face/отчёты висят по 10-60 сек из-за thread-thrash
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - static_trainers:/app/static/trainers
      - static_products:/app/static/products
      - static_scan:/app/static/scan
      - static_brand:/app/static/brand
      - clients_data:/app/static/clients
      - accounting_data:/app/data_accounting
      - face_photos:/app/data/face_photos   # опциональное хранение фото лиц (если клуб включил)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"                  # TLS: раскомментировать и добавить сертификат (см. ниже)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # TLS: положить fullchain.pem и privkey.pem
    depends_on:
      - api
    restart: unless-stopped

  celery-worker:
    image: fitintel:prod
    env_file: .env
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: ${TZ:-Europe/Moscow}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  static_trainers:
    external: true
    name: deploy_static_trainers
  static_products:
    external: true
    name: deploy_static_products
  static_scan:
    external: true
    name: deploy_static_scan
  static_brand:
  clients_data:
    external: true
    name: deploy_clients_data
    name: deploy_static_brand
  accounting_data:
    external: true
    name: deploy_accounting_data
  postgres_prod:
  face_photos:

# networks не задаём — дефолтная сеть compose достаточна (все сервисы в одной)