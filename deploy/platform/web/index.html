<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitIntel Platform</title>
<style>
 body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0}
 header{padding:14px 22px;background:#1e293b;display:flex;gap:18px;align-items:baseline}
 h1{font-size:18px;margin:0;color:#38bdf8}
 .muted{color:#94a3b8;font-size:12px}
 main{padding:22px;display:grid;grid-template-columns:2fr 1fr;gap:22px}
 table{width:100%;border-collapse:collapse}
 th,td{padding:8px 10px;border-bottom:1px solid #334155;text-align:left;font-size:13px}
 th{color:#94a3b8;font-weight:600}
 tr.club{cursor:pointer} tr.club:hover{background:#1e293b}
 .badge{padding:2px 10px;border-radius:10px;font-size:12px}
 .ok{background:#064e3b;color:#34d399}.grace{background:#713f12;color:#fbbf24}
 .expired,.no{background:#7f1d1d;color:#fca5a5}
 .card{background:#1e293b;border-radius:10px;padding:16px}
 pre{white-space:pre-wrap;font-size:12px;color:#cbd5e1;max-height:300px;overflow:auto}
 h2{font-size:14px;color:#94a3b8;margin:0 0 10px}
</style>
</head>
<body>
<header><h1>FitIntel Platform</h1><span class="muted" id="ts"></span><span class="muted">админ: <span id="who"></span></span></header>
<main>
 <div class="card"><h2>Клубы</h2><table id="clubs"><tr><th>Клуб</th><th>Slug</th><th>Лицензия</th><th>Дней</th><th>Last seen</th></tr></table>
   <div id="hb" style="margin-top:14px"><h2>Heartbeat выбранного клуба</h2><pre id="hbpre">—</pre></div></div>
 <div class="card"><h2>Аудит (последние 50)</h2><pre id="audit">—</pre></div>
</main>
<script>
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
async function load(){
 try{
  const d=await j("/platform/clubs");document.getElementById("who").textContent=d.admin;
  const tb=document.getElementById("clubs");tb.querySelectorAll("tr.club").forEach(e=>e.remove());
  for(const c of d.clubs){
   let st="no_license",days="—";
   try{const l=await j("/platform/clubs/"+c.slug+"/license");st=l.status;days=l.days_left??"—"}catch(e){}
   const tr=document.createElement("tr");tr.className="club";
   tr.innerHTML=`<td>${esc(c.name)}</td><td>${esc(c.slug)}</td><td><span class="badge ${st}">${st}</span></td><td>${days}</td><td>${esc(c.last_seen_at?c.last_seen_at.replace("T"," ").slice(0,19):"—")}</td>`;
   tr.onclick=async()=>{const h=await j("/platform/clubs/"+c.slug+"/heartbeat");
     document.getElementById("hbpre").textContent=h.heartbeat?JSON.stringify(h.heartbeat,null,1):"нет heartbeat"};
   tb.appendChild(tr)}
  const a=await j("/platform/audit?limit=50");
  document.getElementById("audit").textContent=a.audit.map(x=>`${x.at.replace("T"," ").slice(0,19)}  ${x.actor}  ${x.action}  ${x.object??""}`).join("\n")||"пусто";
  document.getElementById("ts").textContent="обновлено: "+new Date().toLocaleTimeString();
 }catch(e){document.getElementById("ts").textContent="ОШИБКА: "+e.message}
}
load();setInterval(load,30000);
</script>
</body>
</html>
