version: "3.8"
# FitIntel Platform — этап Б: + platform_api (клубы, heartbeat, лицензии, аудит)
services:
  platform_db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?задайте в .env}
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform_api:
    build: ./api
    network_mode: service:wireguard   # api разделяет netns с wireguard -> доступ к 10.0.0.x
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://platform_user:${PLATFORM_DB_PASSWORD}@platform_db:5432/platform
      ADMIN_CNS: ${ADMIN_CNS:-andrei@fitintel.local}
    depends_on:
      platform_db:
        condition: service_healthy

  license_studio_api:
    build: ./license_studio_api
    restart: unless-stopped
    environment:
      LICENSE_PRIVATE_KEY_PATH: /run/secrets/license_private_key
    secrets:
      - license_private_key

  wireguard:
    image: linuxserver/wireguard:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules:ro
    environment:
      SERVERURL: ${PUBLIC_IP:?79.174.46.68 — задайте в .env}
      SERVERPORT: "51820"
      PEERS: "10"
      PEERDNS: "auto"
      INTERNAL_SUBNET: "10.0.0.0/24"
      ALLOWEDIPS: "10.0.0.0/24"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
      - ./web:/usr/share/nginx/web:ro
    depends_on:
      - platform_api

volumes:
  platform_db_data:
  wireguard_config:

secrets:
  license_private_key:
    file: ./secrets/license_private.key
