events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/platform_access.log;
    error_log  /var/log/nginx/platform_error.log;

    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate        /etc/nginx/certs/server.crt;
        ssl_certificate_key    /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client      on;
        ssl_crl                /etc/nginx/certs/ca.crl;

        location / {
            proxy_pass http://platform_api:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # CN предъявленного клиентского сертификата — авторизация админа в API
            proxy_set_header X-Client-CN $ssl_client_s_dn;
            proxy_read_timeout 30s;
        }
    }
}
