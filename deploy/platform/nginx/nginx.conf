server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;                 # mTLS: без клиентского сертификата — handshake fail
    ssl_crl             /etc/nginx/certs/ca.crl;   # отзыв сертификатов

    location / {
        # Заготовка до этапа Б: platform_api:8002. Пока — заглушка-статус.
        add_header Content-Type application/json;
        return 200 '{"ok": true, "service": "fitintel-platform", "stage": "A: wg+mtls+db"}';
    }

    location /health {
        add_header Content-Type application/json;
        return 200 '{"ok": true}';
    }
}
