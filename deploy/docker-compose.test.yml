# FitIntel Pro — ТЕСТОВЫЙ деплой на VM (plain HTTP, сборка из исходников)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnexus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fitnexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitintel_test_pass}
      TZ: Europe/Moscow
    volumes:
      - postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fitnexus_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend
    restart: unless-stopped

  api:
    build: ..                      # <-- собираем из исходников, не из registry
    env_file:
      - .env
    image: fitintel:test
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fitnexus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fitnexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitintel_test_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-change-me}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: Europe/Moscow
      # лимиты BLAS-потоков: на слабых VM многопоточный OpenBLAS в 2 воркерах
      # устраивает thread-thrash и 10-60-секундные запросы (face/dlib, numpy)
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - face_photos:/app/data/face_photos   # опциональное хранение фото лиц (если клуб включил)
      - ../static:/app/static
      - ./uploads_data/brand:/app/static/brand
      - ./uploads_data/products:/app/static/products
      - ./uploads_data/trainers:/app/static/trainers
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"                    # <-- plain HTTP, без SSL
    volumes:
      - ./nginx/nginx-test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - frontend
    restart: unless-stopped

  celery-worker:
    image: fitintel:test
    volumes:
      - ..:/app
    environment:
      APP_ENV: prod
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fitnexus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fitnexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitintel_test_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-change-me}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: Europe/Moscow
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - db
      - redis
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      disable: true               # healthcheck образа для API, воркеру не нужен

volumes:
  postgres_test:
  face_photos:

networks:
  backend:
  frontend: